name: install-container

# Split out of ci.yml deliberately, for two reasons that are not the usual
# "the file got long":
#
#   1. This job is the slowest in CI: a full system upgrade, ~100 packages,
#      and ly built from source with a downloaded zig. Its own workflow file
#      lets it carry the `paths:` filter below, so a docs-only push does not
#      pay for it.
#   2. It is the only job that MUTATES a system rather than inspecting one, so
#      keeping it separate from the fast inspection jobs in ci.yml makes the
#      distinction visible in the Actions list.
#
# KNOWN, ACCEPTED DEBT: the assert step below is a ~140-line inline bash body,
# well past this repo's 60-line convention, and `tests/lint.sh` does NOT lint
# bash embedded in YAML (it covers scripts/, tests/ and root *.sh). It is
# shellcheck-clean as of 2026-08-13, but only because it was extracted and
# checked by hand. EXTRACT AND SHELLCHECK IT BY HAND when editing it, or move
# it to tests/ and have this job invoke it the way ci.yml's lint and
# build-suckless jobs invoke theirs.

on:
  push:
    # void: the Void Linux port's branch (scope I), until it merges.
    branches: [main, void]
    # Allowlist, not a denylist: everything the installer installs, deploys,
    # builds or reads. A new top-level directory is NOT covered until it is
    # added here — which is the safe direction for a 30-minute job.
    paths:
      - 'scripts/**'
      - 'packages/**'
      - 'suckless/**'
      - 'config/**'
      - 'themes/**'
      - 'VERSION'
      - '.github/workflows/install-container.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'packages/**'
      - 'suckless/**'
      - 'config/**'
      - 'themes/**'
      - 'VERSION'
      - '.github/workflows/install-container.yml'
  # So a full run can be triggered by hand after a docs-only change, or to
  # re-check against a newer Void image without pushing anything.
  workflow_dispatch:

# Cancel superseded runs on the same ref so pushes don't queue stale CI.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The only job anywhere in this repo that runs the installer. In ci.yml,
  # package-names validates the installer's INPUTS (every name in
  # packages/*.lst resolves against the live index) and never invokes
  # scripts/install-void.sh at all; build-suckless compiles the C programs
  # without installing anything around them. Between them, "does a full
  # install actually complete on a clean Void?" was unproven — which is why
  # "run install-void.sh end-to-end" sat open in MASTER_PLAN.md from
  # 2026-08-04.
  #
  # Deliberately slow and real: a full upgrade, ~100 packages, the nonfree
  # repo, two git clones, five suckless builds and ly built from source. The
  # failures it is here to catch are a stage that aborts and a package that
  # resolves but does not install — neither is reachable from a lint or a
  # dry run.
  install-container:
    name: install-container (void-glibc)
    runs-on: ubuntu-latest
    # A full local run in this image took ~7 minutes (2026-10-15, docker on
    # the dev host: bootstrap, then install-void.sh 16:30:37 -> 16:37:11, ly
    # build included); 40 leaves room for a slow mirror and a slower runner.
    # A run that exceeds it has hung, not been slow.
    timeout-minutes: 40
    # One leg: Void is rolling (see ci.yml's container jobs).
    container:
      image: ghcr.io/void-linux/void-glibc-full:latest
    defaults:
      run:
        shell: bash
    steps:
      # The image is bare (no bash, no git). The installer upgrades the
      # system itself; this only makes checkout and `run:` possible.
      - name: Bring the image up to date, add bash and git
        shell: sh
        run: |
          # `retry`: every xbps-install in this job downloads from Void's repo,
          # and network blips there (a TLS failure, a timed-out signature,
          # 2026-10-27) failed jobs no change had touched. Three tries, 15 s
          # apart; a real failure still fails. Installed here, before
          # checkout, so every later step in this container can use it.
          # The main repository through Void's own CDN mirror (the same signed
          # packages). repo-default answered GitHub's runners so slowly on
          # 2026-10-27 that retries could not help: a 36-minute build-suckless
          # and a 40-minute timeout. A file in /etc/xbps.d replaces the
          # same-named one in /usr/share/xbps.d. Nonfree is left to the
          # installer, which enables it itself.
          mkdir -p /etc/xbps.d
          echo 'repository=https://repo-fastly.voidlinux.org/current' >/etc/xbps.d/00-repository-main.conf
          mkdir -p /usr/local/bin
          cat >/usr/local/bin/retry <<'EOF'
          #!/bin/sh
          for i in 1 2 3; do "$@" && exit 0; [ "$i" = 3 ] || sleep 15; done
          exit 1
          EOF
          chmod 755 /usr/local/bin/retry
          retry xbps-install -Syu xbps
          retry xbps-install -yu
          retry xbps-install -y bash git

      - uses: actions/checkout@v7

      # No --dry-run, no --skip-suckless: the point is the real thing. Runs as
      # root, so install-services.sh's SUDO array stays empty and install-pre's
      # privilege check passes without sudo being installed.
      - name: Run install-void.sh for real
        run: bash scripts/install-void.sh

      # Every expectation below is DERIVED from a shipped source of truth
      # rather than hand-listed here: the link set comes from `symlinks.sh
      # --list-links`, the binaries from the manifest's own SUCKLESS rows, the
      # package failures from the installer's own closing summary. A hardcoded
      # copy of any of them would be one more enumeration to go stale — this
      # repo has been bitten by that three separate times.
      - name: Assert the install actually landed
        run: |
          fail=0
          note() { echo "::error::$1"; fail=1; }

          echo "::group::stages reached"
          # install-void.sh tees an ANSI-stripped copy of the whole run here.
          log=install.log
          [ -f "$log" ] || { note "no install.log written"; exit 1; }
          # The banner list is READ OUT OF THE ORCHESTRATOR, not restated here.
          # A hand-written copy would catch a renamed stage (loudly) but miss a
          # newly ADDED one entirely — silent under-coverage is the exact drift
          # this repo has been bitten by three times.
          n=0
          while IFS= read -r stage; do
            n=$((n + 1))
            if grep -qF "$stage" "$log"; then
              echo "OK: $stage"
            else
              note "stage banner missing from install.log: $stage"
            fi
          done < <(grep -oE 'blue "=== [^"]+ ==="' scripts/install-void.sh | sed 's/^blue "//; s/"$//')
          [ "$n" -gt 0 ] || note "no stage banners found in install-void.sh — extraction broke"
          # The completion sentinel is separate: it is the last line of the
          # orchestrator, not one of the stage banners it prints along the way.
          if grep -qF "✓ install complete" "$log"; then
            echo "OK: ✓ install complete"
          else
            note "installer did not reach '✓ install complete'"
          fi
          echo "::endgroup::"

          echo "::group::no desktop-critical package failed"
          # The installer never aborts on these by design; it reports them in a
          # red closing summary instead. In CI that summary must be empty, or a
          # keybind ships dead.
          if grep -qF "DESKTOP-CRITICAL package(s) did not install" "$log"; then
            note "desktop-critical packages failed — see the closing summary in install.log"
            # Bounded by the summary's own last line rather than a line count:
            # -A20 ran past the end into the suckless build output.
            sed -n '/DESKTOP-CRITICAL package(s) did not install/,/Install these by hand/p' "$log" || true
          else
            echo "OK: none"
          fi
          echo "::endgroup::"

          echo "::group::symlinks"
          # symlinks.sh --list-links prints "src<TAB>dst" for every pair it
          # manages, so this covers a pair added later with no change here.
          n=0
          while IFS="$(printf '\t')" read -r src dst; do
            [ -n "$dst" ] || continue
            n=$((n + 1))
            if [ ! -L "$dst" ]; then
              note "not a symlink: $dst"
            elif [ "$(readlink "$dst")" != "$src" ]; then
              note "$dst -> $(readlink "$dst") (expected $src)"
            else
              echo "OK: $dst"
            fi
          done < <(bash scripts/symlinks.sh --list-links)
          [ "$n" -gt 0 ] || note "symlinks.sh --list-links produced no pairs"
          echo "::endgroup::"

          echo "::group::ZDOTDIR"
          if grep -q ZDOTDIR "$HOME/.zshenv" 2>/dev/null; then
            echo "OK: $HOME/.zshenv sets ZDOTDIR"
          else
            note "$HOME/.zshenv does not set ZDOTDIR"
          fi
          echo "::endgroup::"

          echo "::group::login shell"
          # Mirrors install-services.sh's own comparison rather than hardcoding
          # a path, so it follows zsh wherever the package puts it. This is the
          # only check that covers the login-shell path — and that path is exactly
          # where the `$USER: unbound variable` bug lived, so leaving it
          # unasserted would let the same class of regression ship green.
          # The directory is resolved physically, as the script does: a PATH
          # with /usr/sbin first finds zsh through the /usr/sbin -> /usr/bin
          # link (Fedora 42+; Void merges /usr/sbin the same way), and that
          # spelling once went into passwd. Comparing against the resolved path
          # makes this the regression guard for that fix too.
          zsh_bin="$(command -v zsh || true)"
          [ -n "$zsh_bin" ] && zsh_bin="$(cd "$(dirname "$zsh_bin")" && pwd -P)/zsh"
          current_shell="$(getent passwd "$(id -un)" 2>/dev/null | cut -d: -f7 || true)"
          if [ -z "$zsh_bin" ]; then
            note "zsh is not installed — packages/core.lst did not land"
          elif [ "$current_shell" = "$zsh_bin" ]; then
            echo "OK: login shell is $current_shell"
          else
            note "login shell is '${current_shell:-<unset>}', expected '$zsh_bin'"
          fi
          echo "::endgroup::"

          echo "::group::runit services enabled"
          # Enabling a runit service is a symlink, so it works in a container
          # with nothing running. The container's /var/service dangles (it
          # points into /run, which only a booted system has), so the installer
          # links into the default runsvdir instead; every SERVICE row must be
          # a link there. ly must be among them, or no display manager is
          # enabled — the bug the Fedora version of this job found on its first
          # run (a unit name that did not exist).
          manifest="${XDG_STATE_HOME:-$HOME/.local/state}/dots/manifest"
          rundir=/etc/runit/runsvdir/default
          n=0
          # Process substitution, not `grep | while`: a pipeline runs the loop
          # in a subshell, so any note() inside it would set fail=1 in a copy
          # and the job would go green on a real finding.
          while IFS="$(printf '\t')" read -r _t name; do
            n=$((n + 1))
            if [ -L "$rundir/$name" ]; then
              echo "OK: $name linked in $rundir"
            else
              note "SERVICE row for $name, but no link in $rundir"
            fi
          # The tab matters: '^SERVICE' alone also matches SERVICEOFF rows,
          # the services dots deliberately UNlinked (tty2's getty).
          done < <(grep "^SERVICE$(printf '\t')" "$manifest" 2>/dev/null || true)
          [ "$n" -gt 0 ] || note "no SERVICE row in the manifest — no runit service was enabled"
          grep -qx "$(printf 'SERVICE\tly')" "$manifest" 2>/dev/null || note "ly was not enabled (no SERVICE row for it)"
          echo "::endgroup::"

          echo "::group::ly built from source"
          # The pinned build (scripts/install-services-ly.sh): every staged
          # file recorded and present, /usr/bin/ly among them.
          n=0
          while IFS="$(printf '\t')" read -r _t _k path; do
            n=$((n + 1))
            [ -e "$path" ] || [ -L "$path" ] || note "LYBUILD row for $path, but it is not there"
          done < <(grep '^LYBUILD' "$manifest" 2>/dev/null || true)
          if [ "$n" -gt 0 ] && [ -x /usr/bin/ly ]; then
            echo "OK: ly built and installed ($n files)"
          else
            note "ly was not built (no LYBUILD rows, or no /usr/bin/ly)"
          fi
          echo "::endgroup::"

          echo "::group::ly login screen themed"
          # The services stage runs scripts/theme/ly-theme.sh after enabling ly.
          # This is the only place it writes the REAL /etc/ly/config.ini of the
          # ly it built; tests/ly-theme.sh covers it against a fixture.
          # Tab-anchored: '^LY' alone also matches the LYBUILD rows, and would
          # pass with no theme row at all.
          if grep -q "^LY$(printf '\t')" "$manifest" 2>/dev/null && grep -qx 'bigclock = en' /etc/ly/config.ini; then
            echo "OK: /etc/ly/config.ini themed, LY row recorded"
          else
            note "ly config not themed (no LY row, or no 'bigclock = en' in /etc/ly/config.ini)"
          fi
          echo "::endgroup::"

          echo "::group::suckless binaries"
          [ -f "$manifest" ] || note "no manifest at $manifest"
          n=0
          while IFS="$(printf '\t')" read -r _tag _prog path; do
            [ -n "$path" ] || continue
            n=$((n + 1))
            if [ -x "$path" ]; then
              echo "OK: $path"
            else
              note "missing or not executable: $path"
            fi
          done < <(grep '^SUCKLESS' "$manifest" 2>/dev/null || true)
          [ "$n" -gt 0 ] || note "manifest recorded no SUCKLESS rows — did the build run?"
          echo "::endgroup::"

          exit "$fail"

      # Stated, not skipped. A harness that quietly omitted these would read as
      # full coverage of the installer when it is not. Each line below was
      # checked against an actual container run rather than assumed — the first
      # draft of this block claimed chsh could not work here, and it did.
      - name: Report what a container cannot cover
        if: always()
        run: |
          echo "::warning::NOT COVERED by this job — needs real hardware or a VM"
          cat <<'EOF'
          ┌─ COVERED, with a caveat ────────────────────────────────────┐
          usermod -s <zsh> <user>, usermod -aG <groups>
              Work here, and the shell is asserted above. But the job runs
              as ROOT, where SUDO is empty and nothing asks for a password
              — which is how the old `chsh -s` passed here for months while
              failing silently for every real (non-root) user (first VM
              install, 2026-10-05). The sudo path and the wheel check are
              NOT proved here, nor that a real login then starts zsh.

          runit service links (dbus, elogind, NetworkManager, ly, ...)
              Asserted above: enabling is a symlink, which needs the
              service DIRECTORY, not a running runit. In the container they
              go to the default runsvdir, since /var/service dangles.
          └─────────────────────────────────────────────────────────────┘
          ┌─ NOT COVERED ───────────────────────────────────────────────┐
          Any service actually running
              Linking is not starting. Whether runit brings up dbus and
              elogind, whether ly presents a working greeter on tty2 and
              hands off to the session, and whether NetworkManager takes
              the network over from dhcpcd is a VM/hardware question.

          Anything graphical
              No display server exists here. dwm/st/dmenu/dwmblocks/slock
              are built and installed, and never run. The theming engine
              likewise skips its initial apply for want of $DISPLAY.
          └─────────────────────────────────────────────────────────────┘
          EOF

      # On a red run this log is the whole diagnosis, and the interesting part
      # is the end. Printed rather than uploaded as an artifact: that would
      # pin a fourth action version this repo cannot verify from a dev host
      # with no network access to the marketplace, to save a scroll.
      - name: Dump install.log on failure
        if: failure()
        run: |
          echo "::group::install.log (last 200 lines)"
          tail -n 200 install.log || echo "no install.log"
          echo "::endgroup::"
