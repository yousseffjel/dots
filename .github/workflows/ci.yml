name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so pushes don't queue stale CI.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in lockstep with the shellcheck-py rev in .pre-commit-config.yaml —
  # tests/shellcheck-pin.sh fails the build when the two disagree. The digest
  # is of the release asset itself (GitHub release assets are immutable), so
  # bumping the version means recomputing it.
  SHELLCHECK_VERSION: v0.11.0
  SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
  SHFMT_VERSION: v3.13.1
  MARKDOWNLINT_VERSION: 0.49.1

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The three linters this job runs live in tests/lint.sh, which is what
      # actually runs below. This step only provides them.
      #
      # shfmt goes onto $GITHUB_PATH rather than being called by absolute
      # path: tests/lint.sh finds its tools with `command -v`, so a shfmt
      # sitting in an unexported GOPATH/bin would be silently skipped —
      # which under --strict is a failure, by design.
      #
      # shellcheck is pinned like the other two, and for a reason that cost
      # one red build: this step used to accept whatever shellcheck the runner
      # image happened to ship. shellcheck 0.10.0 split unreachable *function
      # bodies* out of SC2317 into SC2329, so a `disable=` directive written
      # against one version is ignored by the other and the finding comes
      # back — green for the author, red here. Pinning makes the linter CI
      # runs the linter .pre-commit-config.yaml already declared.
      # $HOME/.local/bin goes on $GITHUB_PATH, which PREPENDS, so this copy
      # wins over the image's /usr/bin one.
      - name: Install linters
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$RUNNER_TEMP/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          install -m 0755 \
            "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}/shellcheck" \
            "$HOME/.local/bin/shellcheck"
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"
          go install "mvdan.cc/sh/v3/cmd/shfmt@${SHFMT_VERSION}"
          echo "$(go env GOPATH)/bin" >>"$GITHUB_PATH"
          # Installed rather than npx'd so tests/lint.sh's `command -v
          # markdownlint` branch takes the pinned version above; its npx
          # fallback would silently resolve to latest.
          npm install -g "markdownlint-cli@${MARKDOWNLINT_VERSION}"

      # scripts/*.sh, tests/*.sh, and any *.sh directly at the repo root —
      # never suckless/ (C sources), and never the untracked reference clones
      # (CLAUDE.md rule 9), which lint.sh drops by asking git which paths
      # .gitignore already covers rather than naming them a second time.
      #
      # --strict because every tool was just installed above: a "skipped, not
      # installed" line here means that install failed, and without the flag
      # this job would go green having checked nothing.
      - name: shellcheck + shfmt + markdownlint
        run: bash tests/lint.sh --strict

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # tests/run-tests.sh owns the glob, the dedicated-job skip list
      # (build.sh -> build-suckless; lint.sh -> lint), and the hardened
      # workspace/child handling. Invoked here rather than reimplemented so
      # this job cannot drift from what a local run does.
      - name: Run repo tests
        run: tests/run-tests.sh

  build-suckless:
    name: build-suckless (${{ matrix.fedora }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Two images on purpose: `latest` catches "broken on the newest
        # Fedora", the pinned one catches "only works on the newest Fedora".
        # The pin must therefore track the OLDEST SUPPORTED release.
        #
        # An EOL pin does not fail by vanishing — Docker Hub still carries
        # `fedora:41` long after 41 died. It fails because an EOL release's
        # repos move to the archive mirrors, so every `dnf` call in these two
        # jobs starts erroring while the image itself still pulls fine. That is
        # the failure to expect here, and it is why `fedora:41` sat in this
        # matrix through both 41 and 42 going EOL without anyone noticing.
        # Bump this on each Fedora release; do not delete it.
        fedora: ["fedora:latest", "fedora:43"]
    container:
      image: ${{ matrix.fedora }}
    steps:
      - uses: actions/checkout@v7

      # /var/cache/dnf is dnf4's cache path. Fedora releases that default to
      # dnf5 (a different cache layout under /var/cache/libdnf5) simply get
      # no cache hit here — harmless, just a slower cold run on that image.
      - name: Cache dnf metadata + packages
        uses: actions/cache@v6.1.0
        with:
          path: /var/cache/dnf
          key: dnf-build-${{ matrix.fedora }}-${{ hashFiles('scripts/install-suckless.sh') }}
          restore-keys: |
            dnf-build-${{ matrix.fedora }}-

      - name: Install build dependencies
        run: |
          # Reads packages/build.lst instead of restating its names — same
          # parsing as read_pkg_list() in scripts/install-suckless.sh /
          # scripts/install-pkg-tiers.sh / tests/pkglist.sh (CLAUDE.md rule
          # 10). tests/ci-build-deps.sh shims dnf and asserts this step
          # installs exactly what build.lst declares, so this can't drift
          # back into a hardcoded list unnoticed.
          mapfile -t pkgs < <(sed 's/#.*//' packages/build.lst | tr -s '[:space:]' '\n' | grep -v '^$')
          dnf install -y "${pkgs[@]}"

      # tests/build.sh owns the program list and the make invocation. It
      # deliberately does not install build dependencies — that is the step
      # above, and it is the only reason this job exists as a container.
      - name: Build each suckless program (make only, no install)
        run: bash tests/build.sh

      # Deliberately NOT in packages/build.lst: these back tests/dwm-runtime.sh
      # (scope-d slot C) only, and a real install never needs a virtual
      # framebuffer, xdotool, or ImageMagick. build.lst is what
      # install-suckless.sh reads for actual builds — mixing CI-only test
      # tooling into it would mean a standalone build pulling in packages
      # with no purpose outside this job, the same reasoning the "Install
      # linters" step above already follows.
      - name: Install dwm-runtime.sh test dependencies
        run: dnf install -y xorg-x11-server-Xvfb xdotool xwininfo xprop xdpyinfo xrdb xterm ImageMagick

      # First-ever execution of the built dwm binary by this test suite.
      # Asserts real EWMH state plus xresources/actualfullscreen/pertag
      # patch behaviour under Xvfb — see the script's own header for what's
      # a hard failure vs. advisory. Skips loudly (not a failure) if any of
      # the tools above are somehow still missing.
      - name: Run dwm under Xvfb
        run: bash tests/dwm-runtime.sh

  install-dry-run:
    name: install-dry-run (${{ matrix.fedora }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Two images on purpose: `latest` catches "broken on the newest
        # Fedora", the pinned one catches "only works on the newest Fedora".
        # The pin must therefore track the OLDEST SUPPORTED release.
        #
        # An EOL pin does not fail by vanishing — Docker Hub still carries
        # `fedora:41` long after 41 died. It fails because an EOL release's
        # repos move to the archive mirrors, so every `dnf` call in these two
        # jobs starts erroring while the image itself still pulls fine. That is
        # the failure to expect here, and it is why `fedora:41` sat in this
        # matrix through both 41 and 42 going EOL without anyone noticing.
        # Bump this on each Fedora release; do not delete it.
        fedora: ["fedora:latest", "fedora:43"]
    container:
      image: ${{ matrix.fedora }}
    steps:
      - uses: actions/checkout@v7

      # See the build-suckless job for the dnf4-vs-dnf5 cache-path caveat.
      - name: Cache dnf metadata
        uses: actions/cache@v6.1.0
        with:
          path: /var/cache/dnf
          key: dnf-pkglist-${{ matrix.fedora }}-${{ hashFiles('packages/*.lst') }}
          restore-keys: |
            dnf-pkglist-${{ matrix.fedora }}-

      - name: Validate packages/*.lst against enabled repos
        run: |
          # Same comment/blank-line stripping as read_pkg_list() in
          # scripts/install-pkg-tiers.sh, so this validates exactly what the
          # installer will try to install.
          #
          # Globs rather than naming the lists: the repo has four tiers
          # (core, build, desktop, extra) and a named loop silently stops
          # covering whichever one is added next. build.lst is included even
          # though install-suckless.sh installs it rather than install-pkg.sh
          # — a renamed -devel header breaks the build just as hard.
          fail=0
          shopt -s nullglob
          lists=(packages/*.lst)
          if [ ${#lists[@]} -eq 0 ]; then
            echo "::error::no packages/*.lst found"
            exit 1
          fi
          echo "validating ${#lists[@]} package lists"
          for list in "${lists[@]}"; do
            echo "::group::$list"
            while IFS= read -r pkg; do
              if dnf list --available "$pkg" >/dev/null 2>&1; then
                echo "OK: $pkg"
              else
                echo "::error file=$list::unknown package: $pkg"
                fail=1
              fi
            done < <(sed 's/#.*//' "$list" | tr -s '[:space:]' '\n' | grep -v '^$')
            echo "::endgroup::"
          done
          exit "$fail"
