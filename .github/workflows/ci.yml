name: CI

on:
  push:
    # void: the Void Linux port's branch (scope I), until it merges.
    branches: [main, void]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so pushes don't queue stale CI.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # All three linter versions below are pinned twice: here, and as the matching
  # hook rev in .pre-commit-config.yaml. tests/linter-pins.sh fails the build
  # when any pair disagrees — including on a Dependabot PR that bumped only the
  # hook (see .github/dependabot.yml). The shellcheck digest
  # is of the release asset itself (GitHub release assets are immutable), so
  # bumping the version means recomputing it.
  SHELLCHECK_VERSION: v0.11.0
  SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
  SHFMT_VERSION: v3.13.1
  MARKDOWNLINT_VERSION: 0.49.1

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The three linters this job runs live in tests/lint.sh, which is what
      # actually runs below. This step only provides them.
      #
      # shfmt goes onto $GITHUB_PATH rather than being called by absolute
      # path: tests/lint.sh finds its tools with `command -v`, so a shfmt
      # sitting in an unexported GOPATH/bin would be silently skipped —
      # which under --strict is a failure, by design.
      #
      # shellcheck is pinned like the other two, and for a reason that cost
      # one red build: this step used to accept whatever shellcheck the runner
      # image happened to ship. shellcheck 0.10.0 split unreachable *function
      # bodies* out of SC2317 into SC2329, so a `disable=` directive written
      # against one version is ignored by the other and the finding comes
      # back — green for the author, red here. Pinning makes the linter CI
      # runs the linter .pre-commit-config.yaml already declared.
      # $HOME/.local/bin goes on $GITHUB_PATH, which PREPENDS, so this copy
      # wins over the image's /usr/bin one.
      - name: Install linters
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$RUNNER_TEMP/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          install -m 0755 \
            "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}/shellcheck" \
            "$HOME/.local/bin/shellcheck"
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"
          go install "mvdan.cc/sh/v3/cmd/shfmt@${SHFMT_VERSION}"
          echo "$(go env GOPATH)/bin" >>"$GITHUB_PATH"
          # Installed rather than npx'd so tests/lint.sh's `command -v
          # markdownlint` branch takes the pinned version above; its npx
          # fallback would silently resolve to latest.
          npm install -g "markdownlint-cli@${MARKDOWNLINT_VERSION}"

      # scripts/*.sh, tests/*.sh, and any *.sh directly at the repo root —
      # never suckless/ (C sources), and never the untracked reference clones
      # (CLAUDE.md rule 9), which lint.sh drops by asking git which paths
      # .gitignore already covers rather than naming them a second time.
      #
      # --strict because every tool was just installed above: a "skipped, not
      # installed" line here means that install failed, and without the flag
      # this job would go green having checked nothing.
      - name: shellcheck + shfmt + markdownlint
        run: bash tests/lint.sh --strict

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # tmux backs tests/tmux-xdg-paths.sh's live layer, which loads the real
      # tmux config lines into an isolated server. Installed explicitly rather
      # than trusted to the runner image: without it that layer skips and the
      # job goes green having checked only the static half.
      - name: Install tmux for tests/tmux-xdg-paths.sh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux

      # tests/run-tests.sh owns the glob, the dedicated-job skip list
      # (build.sh -> build-suckless; lint.sh -> lint), and the hardened
      # workspace/child handling. Invoked here rather than reimplemented so
      # this job cannot drift from what a local run does.
      - name: Run repo tests
        run: tests/run-tests.sh

  # The two container jobs below run in Void's own image. One leg, not a
  # matrix: Void is rolling, so there is no "oldest supported release" to pin
  # beside latest (the Fedora jobs had fedora:latest + the oldest supported).
  #
  # The image is bare (checked 2026-10-15: 64 packages, no bash, no git), so
  # each job starts with a step under plain sh that does what the installer
  # does first — sync, update xbps, full upgrade (Void has no partial
  # upgrades) — and adds bash and git, which actions/checkout and every later
  # `run:` need.
  build-suckless:
    name: build-suckless (void-glibc)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-glibc-full:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Bring the image up to date, add bash and git
        shell: sh
        run: |
          xbps-install -Syu xbps
          xbps-install -yu
          xbps-install -y bash git

      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          # Reads packages/build.lst instead of restating its names — same
          # parsing as read_pkg_list() in scripts/install-suckless.sh /
          # scripts/install-pkg-tiers.sh / tests/pkglist.sh (CLAUDE.md rule
          # 10). tests/ci-build-deps.sh shims xbps-install and asserts this
          # step installs exactly what build.lst declares, so this can't drift
          # back into a hardcoded list unnoticed.
          mapfile -t pkgs < <(sed 's/#.*//' packages/build.lst | tr -s '[:space:]' '\n' | grep -v '^$')
          xbps-install -y "${pkgs[@]}"

      # tests/build.sh owns the program list and the make invocation. It
      # deliberately does not install build dependencies — that is the step
      # above, and it is the only reason this job exists as a container.
      - name: Build each suckless program (make only, no install)
        run: bash tests/build.sh

      # tests/bidi.sh compiles the bidi() helpers out of the shipped dwm.c and
      # dmenu.c against fribidi (from build.lst above) under AddressSanitizer.
      # The ASan runtime is NOT in build.lst — a real build never needs it.
      # On Void it is libsanitizer-devel. --strict makes a missing compiler,
      # header or ASan runtime a failure; the tests job, which has none of
      # them, skips the script instead.
      - name: Install the ASan runtime for tests/bidi.sh
        run: xbps-install -y libsanitizer-devel

      - name: Check the fribidi patches' bidi() under ASan
        run: bash tests/bidi.sh --strict

      # Deliberately NOT in packages/build.lst: these back tests/dwm-runtime.sh
      # only, and a real install never needs a virtual framebuffer, xdotool,
      # or ImageMagick. Void names (checked against the repo index).
      - name: Install dwm-runtime.sh test dependencies
        run: xbps-install -y xorg-server-xvfb xdotool xwininfo xprop xdpyinfo xrdb xterm ImageMagick procps-ng

      # Asserts real EWMH state plus xresources/actualfullscreen/pertag/
      # restartsig patch behaviour under Xvfb, every check a hard failure.
      - name: Run dwm under Xvfb
        run: bash tests/dwm-runtime.sh

  # The installer's INPUTS against the live repos. tests/void-pkgnames.sh
  # (in the tests job) checks the same names offline against a committed
  # snapshot of the index; this job is what notices the snapshot going stale,
  # because Void renames and drops packages as it rolls. A failure here means
  # a list needs fixing, then `tests/void-pkgnames.sh --refresh`.
  package-names:
    name: package-names (void-glibc, live index)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-glibc-full:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Sync the repo index, add bash and git
        shell: sh
        run: |
          xbps-install -Syu xbps
          xbps-install -y bash git

      - uses: actions/checkout@v7

      - name: Every packages/*.lst name is in Void's main repo
        run: |
          # Same comment/blank-line stripping as read_pkg_list() in
          # scripts/install-pkg-tiers.sh. Globs the lists, never names them
          # (CLAUDE.md rule 10). Main only: the package stages run before the
          # repos step enables nonfree.
          fail=0
          shopt -s nullglob
          lists=(packages/*.lst)
          if [ ${#lists[@]} -eq 0 ]; then
            echo "::error::no packages/*.lst found"
            exit 1
          fi
          for list in "${lists[@]}"; do
            echo "::group::$list"
            while IFS= read -r pkg; do
              if xbps-query -R "$pkg" >/dev/null 2>&1; then
                echo "OK: $pkg"
              else
                echo "::error file=$list::not in Void's main repo: $pkg"
                fail=1
              fi
            done < <(sed 's/#.*//' "$list" | tr -s '[:space:]' '\n' | grep -v '^$')
            echo "::endgroup::"
          done
          exit "$fail"
