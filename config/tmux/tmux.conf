# ── tmux.conf ─ entry point ─────────────────────────────────────────────
# Loads conf.d/*.conf in numeric order. Reload with <prefix>R.

%hidden TMUX_CONF_DIR="$HOME/.config/tmux/conf.d"

source-file "$HOME/.config/tmux/conf.d/00-options.conf"
source-file "$HOME/.config/tmux/conf.d/10-keys.conf"
source-file "$HOME/.config/tmux/conf.d/20-status.conf"
source-file "$HOME/.config/tmux/conf.d/40-popups.conf"
source-file "$HOME/.config/tmux/conf.d/50-blocks.conf"
source-file "$HOME/.config/tmux/conf.d/60-workflows.conf"
# 30-plugins.conf must be sourced last (TPM init goes at the bottom)
source-file "$HOME/.config/tmux/conf.d/30-plugins.conf"
