# ── 20-status.conf ─ tokyonight, top status bar ─────────────────────────
# Palette (tokyonight-night)
#   bg        #1a1b26   bg-dark   #16161e   bg-hi   #292e42
#   fg        #c0caf5   fg-dark   #a9b1d6   comment #565f89
#   blue      #7aa2f7   cyan      #7dcfff   magenta #bb9af7
#   green     #9ece6a   yellow    #e0af68   orange  #ff9e64   red #f7768e

# ── Bar position & cadence ──────────────────────────────────────────────
set -g  status              on
set -g  status-position     top
set -g  status-justify      left
set -g  status-style        "bg=#16161e,fg=#c0caf5"
set -g  status-left-length  60
set -g  status-right-length 140

# ── Window list ─────────────────────────────────────────────────────────
set -g  window-status-style          "bg=#16161e,fg=#565f89"
set -g  window-status-current-style  "bg=#7aa2f7,fg=#1a1b26,bold"
set -g  window-status-activity-style "bg=#16161e,fg=#e0af68"
set -g  window-status-bell-style     "bg=#16161e,fg=#f7768e"
set -g  window-status-format         "  #I:#W#{?window_flags,#{window_flags}, } "
set -g  window-status-current-format " #[bold] #I:#W#{?window_flags,#{window_flags}, } "
set -g  window-status-separator      ""

# ── Pane borders ────────────────────────────────────────────────────────
set -g  pane-border-style        "fg=#292e42"
set -g  pane-active-border-style "fg=#7aa2f7"
set -g  pane-border-lines        single
set -g  pane-border-status       off

# ── Messages / mode line ────────────────────────────────────────────────
set -g  message-style          "bg=#7aa2f7,fg=#1a1b26,bold"
set -g  message-command-style  "bg=#bb9af7,fg=#1a1b26,bold"
set -g  mode-style             "bg=#bb9af7,fg=#1a1b26,bold"

# ── Popups (palette / fzf / claude / etc.) ──────────────────────────────
set -g  popup-style          "bg=#1a1b26,fg=#c0caf5"
set -g  popup-border-style   "fg=#7aa2f7,bg=#1a1b26"
set -g  popup-border-lines   rounded

# ── Activity monitoring ─────────────────────────────────────────────────
setw -g monitor-activity on
set  -g visual-activity  off

# ── Status segments ─────────────────────────────────────────────────────
# Left: session name (highlighted) → divider → empty space
set -g status-left "#[bg=#7aa2f7,fg=#1a1b26,bold]   #S #[bg=#16161e,fg=#7aa2f7] #[default]"

# Right: prefix indicator + zoom + user@host + date + time
set -g status-right "\
#{?client_prefix,#[bg=#f7768e#,fg=#1a1b26#,bold] PREFIX #[default] ,}\
#{?window_zoomed_flag,#[fg=#e0af68] ZOOM ,}\
#[fg=#7dcfff]󰀄 #(whoami) \
#[fg=#565f89]│ \
#[fg=#9ece6a]󰍹 #h \
#[fg=#565f89]│ \
#[fg=#bb9af7]󰃭 %a %d %b \
#[fg=#565f89]│ \
#[fg=#e0af68]󰥔 %H:%M "
