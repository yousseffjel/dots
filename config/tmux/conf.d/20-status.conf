# ── 20-status.conf ─ nord, top status bar ───────────────────────────────
# Palette (Nord — nordtheme.com)
#   Polar Night  nord0 #2e3440  nord1 #3b4252  nord2 #434c5e  nord3 #4c566a
#   Snow Storm   nord4 #d8dee9  nord5 #e5e9f0  nord6 #eceff4
#   Frost        nord7 #8fbcbb  nord8 #88c0d0  nord9 #81a1c1  nord10 #5e81ac
#   Aurora       red #bf616a  orange #d08770  yellow #ebcb8b  green #a3be8c  magenta #b48ead

# ── Bar position & cadence ──────────────────────────────────────────────
set -g  status              on
set -g  status-position     top
set -g  status-justify      left
set -g  status-style        "bg=#2e3440,fg=#d8dee9"
set -g  status-left-length  60
set -g  status-right-length 140

# ── Window list ─────────────────────────────────────────────────────────
set -g  window-status-style          "bg=#2e3440,fg=#4c566a"
set -g  window-status-current-style  "bg=#88c0d0,fg=#2e3440,bold"
set -g  window-status-activity-style "bg=#2e3440,fg=#ebcb8b"
set -g  window-status-bell-style     "bg=#2e3440,fg=#bf616a"
set -g  window-status-format         "  #I:#W#{?window_flags,#{window_flags}, } "
set -g  window-status-current-format " #[bold] #I:#W#{?window_flags,#{window_flags}, } "
set -g  window-status-separator      ""

# ── Pane borders ────────────────────────────────────────────────────────
set -g  pane-border-style        "fg=#3b4252"
set -g  pane-active-border-style "fg=#88c0d0"
set -g  pane-border-lines        single
set -g  pane-border-status       off

# ── Messages / mode line ────────────────────────────────────────────────
set -g  message-style          "bg=#88c0d0,fg=#2e3440,bold"
set -g  message-command-style  "bg=#b48ead,fg=#2e3440,bold"
set -g  mode-style             "bg=#b48ead,fg=#2e3440,bold"

# ── Popups (palette / fzf / claude / etc.) ──────────────────────────────
set -g  popup-style          "bg=#2e3440,fg=#d8dee9"
set -g  popup-border-style   "fg=#88c0d0,bg=#2e3440"
set -g  popup-border-lines   rounded

# ── Activity monitoring ─────────────────────────────────────────────────
setw -g monitor-activity on
set  -g visual-activity  off

# ── Status segments ─────────────────────────────────────────────────────
# Left: session name (highlighted) → divider → empty space
set -g status-left "#[bg=#88c0d0,fg=#2e3440,bold]   #S #[bg=#2e3440,fg=#88c0d0] #[default]"

# Right: prefix indicator + zoom + user@host + date + time
set -g status-right "\
#{?client_prefix,#[bg=#bf616a#,fg=#2e3440#,bold] PREFIX #[default] ,}\
#{?window_zoomed_flag,#[fg=#ebcb8b] ZOOM ,}\
#[fg=#8fbcbb]󰀄 #(whoami) \
#[fg=#4c566a]│ \
#[fg=#a3be8c]󰍹 #h \
#[fg=#4c566a]│ \
#[fg=#81a1c1]󰃭 %a %d %b \
#[fg=#4c566a]│ \
#[fg=#ebcb8b]󰥔 %H:%M "
