# ── 10-keys.conf ─ prefix + bindings ────────────────────────────────────

# Prefix → C-Space.  C-b kept as a backup since muscle memory.
unbind C-b
set  -g  prefix    C-Space
set  -g  prefix2   C-b
bind C-Space send-prefix

# vi everywhere (copy-mode + status-line command-prompt)
setw -g  mode-keys   vi
set  -g  status-keys vi

# Reload config
bind R { source-file ~/.config/tmux/tmux.conf ; display-message "tmux config reloaded" }

# ── Splits ──────────────────────────────────────────────────────────────
unbind '"' ; unbind %
bind | split-window -h  -c "#{pane_current_path}"
bind - split-window -v  -c "#{pane_current_path}"
bind \\ split-window -fh -c "#{pane_current_path}"
bind _ split-window -fv -c "#{pane_current_path}"

# ── Windows ─────────────────────────────────────────────────────────────
bind c new-window -c "#{pane_current_path}"
bind X kill-window
bind , command-prompt -I "#W" "rename-window '%%'"
bind '$' command-prompt -I "#S" "rename-session '%%'"

# ── Pane navigation ─────────────────────────────────────────────────────
# Alt+h/j/k/l (no prefix) — Warp-style direct pane jumps
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Prefix + h/j/k/l also works
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize: prefix + Shift-HJKL  (repeatable with -r)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5

# Zoom toggle
bind z resize-pane -Z
bind f resize-pane -Z   ;# fullscreen alias

# Kill pane (no confirmation — we use it a lot)
bind x kill-pane

# ── Window navigation ───────────────────────────────────────────────────
# Alt+1..9 jumps to window N (no prefix)
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9

# Alt+Tab / Alt+Shift+Tab cycle
bind -n M-Tab   next-window
bind -n M-BTab  previous-window

# Move window left/right
bind -r '<' swap-window -d -t -1
bind -r '>' swap-window -d -t +1

# ── Copy mode (vi) ──────────────────────────────────────────────────────
bind Enter copy-mode
bind -T copy-mode-vi v       send-keys -X begin-selection
bind -T copy-mode-vi V       send-keys -X select-line
bind -T copy-mode-vi C-v     send-keys -X rectangle-toggle
bind -T copy-mode-vi r       send-keys -X rectangle-toggle
bind -T copy-mode-vi y       send-keys -X copy-pipe-and-cancel "$HOME/.config/tmux/bin/tmux-copy"
bind -T copy-mode-vi Enter   send-keys -X copy-pipe-and-cancel "$HOME/.config/tmux/bin/tmux-copy"
bind -T copy-mode-vi Escape  send-keys -X cancel
bind -T copy-mode-vi q       send-keys -X cancel

# Mouse: drag-select copies to clipboard but stays in copy-mode (Warp-feel)
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "$HOME/.config/tmux/bin/tmux-copy"
# Right-click pastes most-recent clipboard
bind -n MouseDown3Pane paste-buffer

# ── Misc UX ─────────────────────────────────────────────────────────────
# Detach
bind d detach-client

# Synchronize panes toggle (broadcast to all panes in window)
bind e setw synchronize-panes \; display-message "sync: #{?pane_synchronized,ON,OFF}"

# Clear scrollback + on-screen
bind C-l send-keys C-l \; clear-history \; display-message "scrollback cleared"
