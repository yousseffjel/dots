# ── 00-options.conf ─ core terminal/server options ──────────────────────

# tmux-256color comes from ncurses-term (packages/extra.lst). Without its
# terminfo entry zsh inside tmux cannot clear a line and every redraw leaves
# junk behind, so fall back to screen-256color (ncurses-base) until it is there.
set  -g  default-terminal     "tmux-256color"
if-shell '! infocmp tmux-256color >/dev/null 2>&1' 'set -g default-terminal "screen-256color"'

# True colour and features for the outer terminal: alacritty (the main one),
# kitty, and anything calling itself xterm-256color. One entry per terminal,
# its features joined by ':' — a ',' starts a new entry, which tmux would
# read as a terminal named "clipboard".
set  -ga terminal-overrides   ",xterm-256color:Tc"
set  -as terminal-features    ",alacritty:RGB:clipboard:sync:title:hyperlinks"
set  -as terminal-features    ",xterm-kitty:RGB:clipboard:sync:title:hyperlinks:osc7"

# Mouse: drag panes, click windows, scroll history
set  -g  mouse on

# Don't lag after ESC (matters for nvim)
set  -s  escape-time 10

# Focus events for nvim autoread + vim-tmux-navigator
set  -g  focus-events on

# Big scrollback
set  -g  history-limit 100000

# 1-indexed windows/panes (matches keyboard row order)
set  -g  base-index 1
setw -g  pane-base-index 1
set  -g  renumber-windows on

# Resize to active client only when it's looking
setw -g  aggressive-resize on

# OSC 52: tmux propagates copies up to kitty (and onward to wl-clipboard)
set  -g  set-clipboard on

# Allow passthrough for kitty image protocol etc.
set  -g  allow-passthrough on

# Auto-rename windows from foreground command, but never overwrite
# a window the user explicitly named.
setw -g  automatic-rename on
set  -g  allow-rename off

# UI feedback
set  -g  display-time 2000
set  -g  display-panes-time 1500
set  -g  visual-bell  on
set  -g  bell-action  other

# Repeat-window-keys time (for -r bindings like resize)
set  -g  repeat-time 400

# Windows-status update cadence
set  -g  status-interval 5

# Server-level: longer message history in `<prefix>~`
set  -g  message-limit 200
