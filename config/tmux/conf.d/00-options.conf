# ── 00-options.conf ─ core terminal/server options ──────────────────────

# True-color + kitty features (mouse, sync, hyperlinks, OSC 52 clipboard)
set  -g  default-terminal     "tmux-256color"
set  -ga terminal-overrides   ",xterm-kitty:Tc,xterm-256color:Tc"
set  -ga terminal-features    ",xterm-kitty:RGB,clipboard,sync,title,hyperlinks,osc7"

# Mouse: drag panes, click windows, scroll history
set  -g  mouse on

# Don't lag after ESC (matters for nvim)
set  -s  escape-time 10

# Focus events for nvim autoread + vim-tmux-navigator
set  -g  focus-events on

# Big scrollback
set  -g  history-limit 100000

# 1-indexed windows/panes (matches keyboard row order)
set  -g  base-index 1
setw -g  pane-base-index 1
set  -g  renumber-windows on

# Resize to active client only when it's looking
setw -g  aggressive-resize on

# OSC 52: tmux propagates copies up to kitty (and onward to wl-clipboard)
set  -g  set-clipboard on

# Allow passthrough for kitty image protocol etc.
set  -g  allow-passthrough on

# Auto-rename windows from foreground command, but never overwrite
# a window the user explicitly named.
setw -g  automatic-rename on
set  -g  allow-rename off

# UI feedback
set  -g  display-time 2000
set  -g  display-panes-time 1500
set  -g  visual-bell  on
set  -g  bell-action  other

# Repeat-window-keys time (for -r bindings like resize)
set  -g  repeat-time 400

# Windows-status update cadence
set  -g  status-interval 5

# Server-level: longer message history in `<prefix>~`
set  -g  message-limit 200
