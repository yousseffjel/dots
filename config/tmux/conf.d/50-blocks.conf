# ── 50-blocks.conf ─ Warp-style "command blocks" via OSC 133 ────────────
# The shell emits OSC 133;A on each prompt and OSC 133;C/D around each
# command's output (see /home/ysf/dev/zsh/zsh/conf.d/55-osc133.zsh).
# tmux ≥ 3.4 understands these natively for prompt navigation.

# ── Inside copy-mode (vi) ───────────────────────────────────────────────
# [   prev prompt              ]   next prompt
# {   prev prompt with output  }   next prompt with output
bind -T copy-mode-vi '['  send-keys -X previous-prompt
bind -T copy-mode-vi ']'  send-keys -X next-prompt
bind -T copy-mode-vi '{'  send-keys -X previous-prompt -o
bind -T copy-mode-vi '}'  send-keys -X next-prompt     -o

# ── From normal mode (with prefix) ──────────────────────────────────────
# Enter copy-mode jumped to the previous / next prompt.
bind -N "Block: prev prompt" '[' { copy-mode ; send-keys -X previous-prompt }
bind -N "Block: next prompt" ']' { copy-mode ; send-keys -X next-prompt }

# Without prefix: PageUp / PageDown jump prompt-by-prompt for fast review.
bind -n M-PageUp   { copy-mode ; send-keys -X previous-prompt }
bind -n M-PageDown { copy-mode ; send-keys -X next-prompt }

# ── Block actions ───────────────────────────────────────────────────────
# Copy the *current* command + output (most recent prompt → end of pane)
bind y run-shell "$HOME/.config/tmux/bin/tmux-copy-block"

# Show the most recent command's output in a less popup (great for long logs)
bind o display-popup -E -w 90% -h 90% -T " last block " \
    "$HOME/.config/tmux/bin/tmux-show-block | less -R +G"

# Pipe last block's output straight into Claude (vibe-debug a build/test fail)
bind C-a run-shell "$HOME/.config/tmux/bin/tmux-block-to-claude"
