# ── 40-popups.conf ─ command palette, switchers, AI ─────────────────────
# Warp-feel: every floating UI piece is a tmux popup running fzf or a CLI.

# Command palette — fzf'd menu of common tmux actions
bind Space display-popup -E -w 70% -h 60% \
   -d "#{pane_current_path}" -T " palette " \
   "$HOME/.config/tmux/bin/tmux-palette"

# Session switcher / killer / creator
bind s display-popup -E -w 60% -h 60% \
   -T " sessions " \
   "$HOME/.config/tmux/bin/tmux-sessions"

# Window switcher (within current session)
bind w display-popup -E -w 60% -h 60% \
   -T " windows " \
   "$HOME/.config/tmux/bin/tmux-windows"

# AI assistant — Claude Code, popup over the active pane
# `<prefix> a` → fresh session;  `<prefix> A` → resume previous session
bind a display-popup -E -w 90% -h 90% \
   -d "#{pane_current_path}" -T " claude " \
   "claude"
bind A display-popup -E -w 90% -h 90% \
   -d "#{pane_current_path}" -T " claude --continue " \
   "claude --continue"

# Workflow runner (parametric command templates)
bind r display-popup -E -w 70% -h 60% \
   -T " workflows " \
   "$HOME/.config/tmux/bin/tmux-workflow"

# Cheatsheet — searchable list of every binding
bind ? display-popup -E -w 80% -h 80% \
   -T " keybindings " \
   "tmux list-keys -N | sort | fzf --prompt='binding> ' --reverse"

# Floating shell scratchpad (lazygit-on-top vibe). Exits closes the popup.
bind g display-popup -E -w 80% -h 80% \
   -d "#{pane_current_path}" -T " scratch "
