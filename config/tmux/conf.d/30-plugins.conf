# ── 30-plugins.conf ─ TPM + plugin set (loaded LAST) ────────────────────

# Plugins live under the XDG data dir, not the legacy ~/.tmux/plugins/.
#
# WHY EVERY PATH BELOW GOES THROUGH run-shell / if-shell WITH SINGLE QUOTES:
# tmux.conf is not a shell. It expands $VAR and ${VAR}, but has no
# ${VAR:-default} form, so an unset XDG_DATA_HOME would collapse the path to
# "/tmux/plugins". Single-quoted command strings are passed through untouched
# and expanded by /bin/sh, which does have it. Double quotes here would let
# tmux expand them first and reintroduce exactly that bug.
#
# This must stay in step with TPM_DIR in scripts/install-restore.sh, which
# pre-clones TPM. If the two disagree the installer clones to a directory
# tmux never reads, and the bootstrap below silently clones a second copy.
run-shell 'tmux set-environment -g TMUX_PLUGIN_MANAGER_PATH "${XDG_DATA_HOME:-$HOME/.local/share}/tmux/plugins/"'

# TPM itself
set -g @plugin 'tmux-plugins/tpm'

# Sane defaults that play nice with everything else
set -g @plugin 'tmux-plugins/tmux-sensible'

# Save & restore tmux sessions (Warp-style "comes back" behavior)
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-dir                    "$HOME/.local/state/tmux/resurrect"
set -g @resurrect-capture-pane-contents  'on'
set -g @resurrect-strategy-vim           'session'
set -g @resurrect-strategy-nvim          'session'

# Continuum: auto save every 15 min + auto restore on tmux start
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-save-interval '15'
set -g @continuum-restore       'on'

# Yank: tmux-yank auto-detects wl-copy / xclip / pbcopy. On a headless server
# (none of those installed) tmux's set-clipboard on (00-options) propagates
# the selection to the outer terminal via OSC 52 over SSH.
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @yank_selection        'clipboard'
set -g @yank_selection_mouse  'clipboard'
set -g @yank_action           'copy-pipe-no-clear'

# Bootstrap TPM on first run. One run-shell doing its own existence check,
# rather than if-shell wrapping a run-shell: the nested form needs an inner
# quoting level, and tmux expands $VAR inside double quotes, which would undo
# the ${VAR:-default} above. A single-quoted body has no such level.
#
# Normally a no-op — scripts/install-restore.sh pre-clones TPM so first launch
# is not blocked on the network. This covers a tmux config deployed without
# the installer.
run-shell 'd="${XDG_DATA_HOME:-$HOME/.local/share}/tmux/plugins/tpm"; [ -d "$d" ] || { git clone --depth=1 https://github.com/tmux-plugins/tpm "$d" && "$d/bin/install_plugins"; }'

# Initialize TPM (must be the last line)
run-shell '"${XDG_DATA_HOME:-$HOME/.local/share}/tmux/plugins/tpm/tpm"'
