# ── 30-plugins.conf ─ TPM + plugin set (loaded LAST) ────────────────────

# Plugins live under XDG state dir, not the legacy ~/.tmux/plugins/
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/share/tmux/plugins/"

# TPM itself
set -g @plugin 'tmux-plugins/tpm'

# Sane defaults that play nice with everything else
set -g @plugin 'tmux-plugins/tmux-sensible'

# Save & restore tmux sessions (Warp-style "comes back" behavior)
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-dir                    "$HOME/.local/state/tmux/resurrect"
set -g @resurrect-capture-pane-contents  'on'
set -g @resurrect-strategy-vim           'session'
set -g @resurrect-strategy-nvim          'session'

# Continuum: auto save every 15 min + auto restore on tmux start
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-save-interval '15'
set -g @continuum-restore       'on'

# Yank: tmux-yank auto-detects wl-copy / xclip / pbcopy. On a headless server
# (none of those installed) tmux's set-clipboard on (00-options) propagates
# the selection to the outer terminal via OSC 52 over SSH.
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @yank_selection        'clipboard'
set -g @yank_selection_mouse  'clipboard'
set -g @yank_action           'copy-pipe-no-clear'

# Bootstrap TPM on first run
if-shell "test ! -d $HOME/.local/share/tmux/plugins/tpm" \
   "run-shell 'git clone --depth=1 https://github.com/tmux-plugins/tpm $HOME/.local/share/tmux/plugins/tpm \
      && $HOME/.local/share/tmux/plugins/tpm/bin/install_plugins'"

# Initialize TPM (must be the last line)
run-shell '$HOME/.local/share/tmux/plugins/tpm/tpm'
