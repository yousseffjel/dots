# ── 60-workflows.conf ─ workflow runner ─────────────────────────────────
# Workflows live in TSV files at:  ~/.config/tmux/workflows/*.tsv
#
#   <name>\t<description>\t<command (with {placeholders})>
#
# Example:
#   gco\tcheckout branch\tgit checkout {branch}
#
# Lines starting with `#` are comments. Empty lines are ignored.
# Run with <prefix>r — fzf picks one, prompts for any {placeholders},
# then `send-keys` the templated command into the active pane.
#
# (Binding lives in 40-popups.conf; runner script in bin/tmux-workflow.)
