# zram swap tuning — installed by dots (scripts/install-services-maint.sh) as
# /etc/sysctl.d/99-dots-zram.conf, only where swap is on zram. Void loads it
# at every boot (/etc/runit/core-services/08-sysctl.sh).
#
# zram is compressed RAM, far faster to swap to than a disk, so the kernel
# should prefer it over dropping file cache. The kernel's own docs allow
# swappiness above 100 for in-memory swap; 180 is the value the Arch wiki's
# zram page and Pop!_OS use. A disk swapfile behind zram (lower priority)
# only takes what zram cannot.
vm.swappiness = 180
# Read one page per swap-in, not eight: read-ahead saves seeks on a disk,
# and RAM has none to save.
vm.page-cluster = 0
