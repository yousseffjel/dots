<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  dots font stack: English in a Latin face, Arabic handed to Noto behind it.

  Symlinked as ~/.config/fontconfig by scripts/symlinks.sh, so an edit here
  applies on the next `fc-cache -f` / app restart. docs/FONTS.md explains the
  whole stack, including what terminals cannot do with Arabic.

  Every family named in this file must be installed by packages/*.lst —
  tests/fontconfig-stack.sh fails the build otherwise, because a <prefer>
  naming a missing family is silently skipped and the stack degrades with
  no error anywhere.
-->
<fontconfig>

  <!--
    Rendering. Must agree with the Xft/* keys theme_write_xsettingsd_conf
    serves to GTK (scripts/install-restore-theme-identity.sh): xsettingsd only
    reaches GTK, this reaches everything else that uses fontconfig directly —
    dwm, dmenu, st, alacritty, Qt, Firefox's non-GTK paths.
  -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>

  <!--
    Generic families. The Arabic face sits directly behind the Latin one so
    a codepoint the Latin face lacks falls through to it, rather than to
    whatever system default ranks next — DejaVu Sans, on most installs,
    whose Arabic is a minimal fallback set.
  -->
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Noto Sans Arabic</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Noto Naskh Arabic</family>
    </prefer>
  </alias>

  <!--
    Cascadia Code NF carries the base Arabic letters but not the
    presentation forms (U+FE70-FEFF) that fribidi's shaping emits for dwm and
    dmenu — Noto Sans Arabic fills those. Noto Sans Mono sits between them so
    that a box missing Cascadia still gets a MONOSPACE Latin face; without it
    the next family with Latin glyphs is the proportional Arabic one.
  -->
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>Cascadia Code NF</family>
      <family>Noto Sans Mono</family>
      <family>Noto Sans Arabic</family>
    </prefer>
  </alias>

  <!--
    Text explicitly tagged Arabic (an HTML lang="ar" page, a GTK label in an
    Arabic locale) goes to the Arabic face FIRST, so its digits and
    punctuation match the script around them instead of the Latin face's.
    prepend_first, not prepend: plain prepend inserts just before the matched
    "sans-serif", which the aliases above already put the Latin face ahead of.
  -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ar</string></test>
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Noto Sans Arabic</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains"><string>ar</string></test>
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Noto Naskh Arabic</string>
    </edit>
  </match>

</fontconfig>
