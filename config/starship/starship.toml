# starship prompt for the dots desktop.
#
# Adopted verbatim from the user's own ~/.config/starship/starship.toml, with
# the distro logo changed — see below. Deployed by scripts/symlinks.sh, which
# links config/starship/ to ~/.config/starship/. starship's own default path is
# the bare $XDG_CONFIG_HOME/starship.toml and symlinks.sh links directories,
# not files, so conf.d/99-prompt.zsh has to set $STARSHIP_CONFIG either way.
#
# REQUIRES A NERD FONT. The glyphs below (distro mark, git branch, per-language
# symbols) come from cascadia-code-nf-fonts in packages/extra.lst. Without it
# they render as tofu boxes.
#
# THEMED FROM THE WALLPAPER. The five colours this config actually paints now
# live in the [palettes.dots] table at the bottom of this file, below a marker
# line. config/theme/templates/always/starship.dcol regenerates that block from
# the current palette and splices it onto a COPY of this file in the cache dir;
# conf.d/99-prompt.zsh points $STARSHIP_CONFIG at that copy when it is newer.
# Nothing ever writes back into this repo. Edit anything you like ABOVE the
# marker; everything below it is replaced on the next wallpaper change.
#
# The language modules deliberately keep their `bold bright-cyan`-style ANSI
# names rather than palette entries: those resolve against the terminal's own
# 16-colour palette, which the engine already themes through xresources and
# alacritty-colors.toml. Converting them would theme them twice.
#
# TRIMMED FROM THE ORIGINAL 405 LINES. 44 [section] blocks for toolchains this
# repo neither declares nor installs (cobol, daml, vlang, raku, purescript,
# terraform, the cloud providers, …) were removed, along with their entries in
# right_format — leaving them there would have let starship fall back to its
# default glyph-heavy rendering if such a toolchain ever appeared. Verified
# byte-identical right-prompt output against the original in a directory
# carrying markers for every kept language. starship has no include directive,
# so this is the only way to satisfy the 250-line cap in
# rules/foundations/file-architecture.md. To restore one, re-add its [section]
# block and its $module line in right_format.
# "$schema" = 'https://starship.rs/config-schema.json'
add_newline = false
format = """\
   \
  $directory\
  $git_branch$git_commit$git_state $git_status\
  $character\n
"""
right_format = """
$c\
$golang\
$java\
$lua\
$nodejs\
$perl\
$python\
$rust\
$memory_usage\
$cpp\
$php\
$time"""

continuation_prompt = '▶▶ '

# Names resolved from [palettes.dots] at the bottom of this file. A `palette`
# naming a table that does not exist is not a silent fallback: every module
# using those names loses its colour, and starship writes
#   [WARN] - (starship::config): Could not find color palette: dots
# to stderr twice on the first prompt of each shell session — it dedupes via
# $STARSHIP_CACHE/session_<key>.log, so it is not once per render, but it is
# once per new terminal, which is worse to look at. Keep the table present.
palette = 'dots'


# style_choices:
# bold
# italic
# underline
# dimmed
# inverted
# blink
# hidden
# strikethrough
# bg:<color>
# fg:<color>
# <color>
# none

#NOTE: you can customize the symbols, e.g:
# [character]
# success_symbol = "[  ]($bold fg:#f8f8f2)"
# error_symbol = "[ ➤ ]($bold fg:#fb4934)"

[directory]
disabled = false
format = "[$path](bold fg:c_dir)"
truncate_to_repo = false
# home_symbol = "" 

[git_branch]
format = " [  $branch](fg:c_git_branch)"

[git_status]
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
format = '[[( $all_status$ahead_behind )](fg:c_git_status)]($style)'
# Currently paints nothing: the inner (fg:…) span covers the whole segment, so
# the outer ($style) has no cells left to fill. Verified by swapping it for
# bright red and getting byte-identical output. Kept and themed rather than
# deleted, so the value is already right if the format ever grows a gap.
style = "bg:c_git_status_bg"


[time]
disabled = false
format = '[[  $time ](fg:c_time )]($style)'
time_format = "%R"                            # Hour:Minute Format

[lua]
format = " [lua](italic) [${symbol}]($style)"
style = "bold bright-yellow"
symbol = "⨀ "
version_format = "${raw}"

[nodejs]
detect_extensions = []
detect_files = ["package-lock.json", "yarn.lock"]
detect_folders = ["node_modules"]
format = "[ ](bold bright-green)"
version_format = "${raw}"

[python]
format = "[${symbol}(${virtualenv}) ${version}]($style)"
style = "bold bright-yellow"
symbol = "[ ](bold bright-blue)"
version_format = "${raw}"

[rust]
style = "bold bright-red"
format = " rs(italic) $symbol($style)"
symbol = " "

[c]
style = "bold bright-cyan"
format = " [$symbol(-$name)]($style)"
symbol = "ℂ "

[cpp]
style = "bold bright-cyan"
format = " [cpp](italic) [$symbol]($style)"
symbol = " "

[perl]
format = " [perl](italic) [$symbol]($style)"
style = "bold bright-cyan"
symbol = " "

[php]
format = " [php](italic) [$symbol]($style)"
style = "bold bright-red"
symbol = " "

[golang]
style = "bold bright-blue"
format = " go [$symbol]($style)"
symbol = "∩ "

[java]
style = "bold bright-red"
format = " java [${symbol}]($style)"
symbol = " "

[memory_usage]
style = "bold bright-cyan"
format = " mem [${ram}( ${swap})]($style)"
symbol = "▪▫▪ "

# ### dots-theme palette ###
# EVERYTHING BELOW THIS LINE IS REGENERATED. config/theme/templates/always/
# starship.dcol renders this table from the current wallpaper palette and
# splices it onto a copy of this file in $XDG_CACHE_HOME/dots/theme/. Put your
# own settings ABOVE the marker; edits made here survive only until the next
# wallpaper change. The values below are the static fallback used when no
# theme has been applied yet — they are the original adopted colours.
#
# This table must exist even unthemed: `palette = 'dots'` with no matching
# table drops the colours and greets every new terminal with a warning.
[palettes.dots]
c_dir = '#8be9fd'
c_git_branch = '#9198a1'
c_git_status = '#769ff0'
c_git_status_bg = '#394260'
c_time = '#a0a9cb'

