# Which xdg-desktop-portal backend serves each portal interface.
# Linked into ~/.config/xdg-desktop-portal/ by scripts/symlinks.sh.
#
# Desktops normally ship their own <desktop>-portals.conf keyed on
# XDG_CURRENT_DESKTOP. A dwm session sets no XDG_CURRENT_DESKTOP, so
# xdg-desktop-portal reads this desktop-independent file instead. Without it
# the gtk backend is still chosen, but only as a "last-resort fallback", with
# a warning in the journal for every interface; this states it outright.
# See portals.conf(5).
#
# gtk is the portal backend this repo installs (packages/extra.lst): the file
# chooser, the Settings portal (the colour-scheme preference), print,
# notifications and the rest it implements. It has no Secret portal, so
# that one interface goes to gnome-keyring (packages/desktop.lst), which ships
# the backend as gnome-keyring.portal. Its `UseIn=gnome` would never match a
# dwm session; without the line below a Flatpak app gets no keyring.
[preferred]
default=gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
