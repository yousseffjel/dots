# Static fallback picom.conf — deployed by the installer so the compositor
# looks right before the theming engine has ever run. On every wallpaper
# change scripts/theme/apply-templates.sh regenerates
# ~/.config/picom/picom.conf from config/theme/templates/always/picom.dcol,
# replacing this content.
#
# Edit that .dcol template, not this file. This copy was generated from it
# with a static dark palette and any hand-edit here is lost on the next
# theme apply.
#
# config/picom is deliberately NOT symlinked into ~/.config: a symlink
# would make the template write back into the repo on every wallpaper
# change. The installer copies it instead.

backend = "glx";
vsync = true;

# Deliberately restrained: shadows and a fade, no blur, no rounded-corner
# tricks, no animation. This runs on a suckless/dwm desktop where the
# compositor's job is tear-free rendering and a little depth, not effects.
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.35;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-color = "#1E1E2E";

shadow-exclude = [
    "class_g = 'dwm'",
    "class_g = 'dmenu'",
    "_GTK_FRAME_EXTENTS@",
    "window_type = 'dock'",
    "window_type = 'desktop'"
];

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 8;
fade-exclude = [ "class_g = 'slock'" ];

# Full opacity everywhere by default — a wallpaper-derived theme already
# supplies the visual identity, and transparent terminals hurt contrast
# against an arbitrary wallpaper.
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;

wintypes:
{
    tooltip = { fade = true; shadow = false; focus = true; };
    dock = { shadow = false; };
    dnd = { shadow = false; };
    popup_menu = { shadow = true; };
    dropdown_menu = { shadow = true; };
};
