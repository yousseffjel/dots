# dots: faster, stall-proof dnf downloads. Copied to
# /etc/dnf/libdnf5.conf.d/ by scripts/install-pkg-dnf.sh (a SYSFILE row:
# `dots uninstall` removes it while it is unedited). /etc/dnf/dnf.conf is read
# after every drop-in, so a value you set there wins over these.
[main]
# Probe mirror latency and pick among the quickest, instead of the
# metalink's order.
fastestmirror=True
# Packages fetched at once (dnf default 3, maximum 20).
max_parallel_downloads=10
# Drop a mirror that sends under 20 KiB/s for 30 seconds and move on. The
# default floor, 1000 B/s, let a 3 KiB/s mirror hold a fresh install for an
# hour (2026-10-14).
minrate=20k
timeout=30
