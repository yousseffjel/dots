# mpv — the default video and audio player (config/mimeapps.list).
#
# Symlinked by scripts/symlinks.sh. Safe to link: mpv writes nothing into its
# config directory by default. Watch-later state goes to $XDG_STATE_HOME/mpv.
#
# HDR on this desktop. X11 has no HDR output path, so every player converts
# HDR to SDR for the display. gpu-next (libplacebo) does that best. Its
# defaults are already the right ones here: tone-mapping=auto (spline on
# gpu-next) and hdr-compute-peak=auto (per-scene peak detection when the GPU
# has compute shaders). Neither is restated below. Real HDR output needs a
# Wayland compositor with colour management, which dwm cannot be.
#
# Codecs. Most HDR releases are 10-bit HEVC. Void's ffmpeg6 (desktop.lst) is
# the full build and decodes it; `dots drivers` installs the GPU's VA-API
# driver for hardware decoding. Check with:
#   mpv --hwdec=vaapi -v <file> 2>&1 | grep -i hwdec

# The trailing comma lets mpv fall back to any other output when gpu-next
# cannot start, e.g. in a VM without 3D acceleration.
vo=gpu-next,

# Hardware decoding, mpv's own whitelist (auto == auto-safe). Copy-back modes
# and unsafe decoders are left out. On Intel this picks vaapi.
hwdec=auto

# Better scalers and dithering. On weak or virtual GPUs, start mpv with
# --profile=fast.
profile=high-quality

# Keep a window open for audio-only files so the keyboard controls still
# work; with no window, mpv plays on in the background.
force-window=yes
