# dots — touchpad behaviour on a laptop (scope-h).
#
# Installed by `dots drivers` to /etc/X11/xorg.conf.d/ on a machine that
# drivers_chassis calls a laptop, and nowhere else. It is a COPY, tracked by a
# SYSFILE manifest row: re-runs replace it only while it is an unedited copy
# of a version this repo shipped, and `dots uninstall` removes it only then.
# To change a setting, edit the installed file; dots will leave it alone.
#
# MatchIsTouchpad is libinput's own classification (udev's
# ID_INPUT_TOUCHPAD), so a mouse or trackball never matches. `Driver` rather
# than `MatchDriver`: Xorg reads /etc/X11/xorg.conf.d before
# /usr/share/X11/xorg.conf.d, where xf86-input-libinput's 40-libinput.conf assigns the
# driver, so a MatchDriver here could see no driver yet and never apply.
# Xorg reads this at server start: log out and back in after installing it.

Section "InputClass"
    Identifier      "dots touchpad"
    MatchIsTouchpad "on"
    Driver          "libinput"
    # One finger taps a left click, two a right, three a middle.
    Option "Tapping"            "on"
    # Content follows the fingers, as on a phone.
    Option "NaturalScrolling"   "true"
    # Ignore palm touches while typing (libinput's default, made explicit).
    Option "DisableWhileTyping" "true"
    # A two-finger physical click is a right-click anywhere on the pad.
    Option "ClickMethod"        "clickfinger"
EndSection
