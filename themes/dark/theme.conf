# themes/dark — non-colour theme settings.
#
# colors.dcol carries the palette; this file carries everything a palette
# cannot express. Rendered into ~/.config/gtk-3.0/settings.ini and
# ~/.config/xsettingsd/xsettingsd.conf by the writers in
# scripts/install-restore-theme-identity.sh — by install-restore.sh at install
# time, and by scripts/theme/theme-apply.sh on every switch to this theme.
# (Until 2026-08-12 theme-apply.sh only *printed* this file.)
#
# Format: key=value, one per line, '#' comments. Parsed with sed/grep — no
# new dependency, matching packages/*.lst.

# Dark GTK theme. GTK4 has Adwaita-dark built in; GTK 3.24 does NOT, and since
# Fedora 44 retired gnome-themes-extra nothing provides it — GTK3 would fall
# back to LIGHT Adwaita. assets/themes/Adwaita-dark is the one-line shim that
# package shipped; install-restore-gtk3-shim.sh deploys it. Keep this name in
# step with that directory: tests/gtk3-adwaita-dark-shim.sh checks the two.
gtk_theme=Adwaita-dark

# papirus-icon-theme (packages/extra.lst) provides the Papirus-Dark variant.
icon_theme=Papirus-Dark

# Vendored, not packaged: neither Void nor Fedora packages Bibata (Fedora
# had it in a COPR only). assets/cursors/ holds the upstream
# tarball; install-restore-cursor.sh extracts it and reads this name back
# out of the archive, so the two cannot drift silently.
cursor_theme=Bibata-Modern-Classic
cursor_size=24

# google-noto-sans-fonts (packages/extra.lst). A proportional UI face; Arabic
# in GTK labels falls through to Noto Sans Arabic via config/fontconfig.
# Terminals, the bar and dmenu keep Cascadia Code NF — see docs/FONTS.md.
font=Noto Sans 10
