# themes/dark — non-colour theme settings.
#
# colors.dcol carries the palette; this file carries everything a palette
# cannot express. Rendered into ~/.config/gtk-3.0/settings.ini and
# ~/.config/xsettingsd/xsettingsd.conf by the writers in
# scripts/install-restore-theme-identity.sh — by install-restore.sh at install
# time, and by scripts/theme/theme-apply.sh on every switch to this theme.
# (Until 2026-08-12 theme-apply.sh only *printed* this file.)
#
# Format: key=value, one per line, '#' comments. Parsed with sed/grep — no
# new dependency, matching packages/*.lst.

# Dark GTK theme. Adwaita-dark ships with GTK itself, so this is the one
# choice guaranteed to exist on a fresh Fedora box with no extra download.
gtk_theme=Adwaita-dark

# papirus-icon-theme (packages/extra.lst) provides the Papirus-Dark variant.
icon_theme=Papirus-Dark

# adwaita-icon-theme (packages/extra.lst) provides Adwaita cursors.
cursor_theme=Adwaita
cursor_size=24

# jetbrains-mono-fonts-all (packages/extra.lst).
font=JetBrains Mono 10
