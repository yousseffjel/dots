# themes/nord — non-colour theme settings.
#
# colors.dcol carries the palette; this file carries everything a palette
# cannot express. Read by scripts/theme/theme-apply.sh, which renders it into
# ~/.config/gtk-3.0/settings.ini and ~/.config/xsettingsd/xsettingsd.conf on
# every switch to this theme.
#
# Format: key=value, one per line, '#' comments. Parsed with sed/grep — no
# new dependency, matching packages/*.lst.

# WHY THIS MATCHES themes/dark: this repo declares exactly one dark GTK theme
# (Adwaita-dark, a GTK3 built-in — see the "fonts & theming" block in
# packages/extra.lst) and one dark icon set. So the identity is currently the
# same for every shipped theme, and these values are repeated per theme rather
# than inherited, because a theme that cannot state its own identity is a theme
# you cannot customise. Install another GTK theme and change the line below —
# the switch will apply it, which is what the identity wiring is for.
gtk_theme=Adwaita-dark

# papirus-icon-theme (packages/extra.lst) provides the Papirus-Dark variant.
icon_theme=Papirus-Dark

# Vendored, not packaged: Fedora has no Bibata package (COPR only, and
# rule 4 makes that the user's call). assets/cursors/ holds the upstream
# tarball; install-restore-cursor.sh extracts it and reads this name back
# out of the archive, so the two cannot drift silently.
cursor_theme=Bibata-Modern-Classic
cursor_size=24

# jetbrains-mono-fonts-all (packages/extra.lst).
font=JetBrains Mono 10
